name: Release new Docker image

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

env:
  BASE_IMAGE_NAME: plone/plone-mcp

jobs:
  release:
    runs-on: ${{ matrix.builder }}
    strategy:
      matrix:
        include:
          - builder: ubuntu-24.04
            platform: linux/amd64
          - builder: ubuntu-24.04-arm
            platform: linux/arm64
    environment: DOCKER_HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set MCP_VERSION
        id: vars
        run: echo "MCP_VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Prepare artifact key
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.BASE_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=pep440,pattern={{version}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.MCP_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.BASE_IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ env.BASE_IMAGE_NAME }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: List digest directory
        working-directory: ${{ runner.temp }}/digests
        run: ls -la

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    environment: DOCKER_HUB
    needs:
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set MCP_VERSION
        id: vars
        run: echo "MCP_VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: List digest directory
        working-directory: ${{ runner.temp }}/digests
        run: ls -la

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.BASE_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=pep440,pattern={{version}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.MCP_VERSION }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.BASE_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.BASE_IMAGE_NAME }}:${{ steps.meta.outputs.version }}