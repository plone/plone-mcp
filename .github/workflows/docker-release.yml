name: Release new Docker image

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

env:
  BASE_IMAGE_NAME: plone/plone-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    environment: DOCKER_HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set MCP_VERSION
        id: vars
        run: echo "MCP_VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=pep440,pattern={{version}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=pep440,pattern={{major}},value=${{ steps.vars.outputs.MCP_VERSION }}
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.MCP_VERSION }}

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}